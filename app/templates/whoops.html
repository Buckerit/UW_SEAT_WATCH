<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Whoops | UW Seat Watch</title>

    <link
        rel="icon"
        href="{{ url_for('static', path='/icons/favicon2.ico') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/app.css') }}?v=20260820-mobile"
    >
</head>

<body>
    <header class="site-band">
        <nav class="site-top" aria-label="Site">
            <a class="brand" href="/">
                <img
                    class="brand-logo"
                    src="{{ url_for('static', path='/icons/favicon2.ico') }}"
                    alt=""
                >

                <span>UW Seat Watch</span>
            </a>

            <a class="site-link" href="/">
                Search
            </a>
        </nav>
    </header>

    <main class="container status-page">
        <section class="status-panel whoops-panel">
            <p class="eyebrow">
                Error {{ status_code }}
            </p>

            <h1>
                Whoops.
            </h1>

            <section class="warning-box">
                <strong>
                    {{ message }}
                </strong>

                <p>
                    Please try again in a moment. If this keeps
                    happening, the site owner can investigate from the
                    server logs.
                </p>
            </section>

            <a class="primary-button" href="/">
                Back to search &rarr;
            </a>
        </section>
    </main>

    {% include "_footer.html" %}
</body>
</html>
